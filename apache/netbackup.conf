# NetBackup — Apache VirtualHost (template)
# Placeholder __SERVER_NAME__ dan __DOCUMENT_ROOT__ diganti oleh install_server.sh

<VirtualHost *:80>
    ServerName __SERVER_NAME__
    ServerAdmin webmaster@__SERVER_NAME__

    DocumentRoot __DOCUMENT_ROOT__

    <Directory __DOCUMENT_ROOT__>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/__SITE_SLUG__-error.log
    CustomLog ${APACHE_LOG_DIR}/__SITE_SLUG__-access.log combined
</VirtualHost>
